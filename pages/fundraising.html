<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundraising Consulting Services | Alex Klausing</title>
    <meta name="description" content="Professional fundraising consulting services and training for nonprofits by Alex Klausing.">
    <meta name="author" content="Alex Klausing">
    <link href="../dist/output.css" rel="stylesheet">
</head>
<body class="flex flex-col min-h-screen font-sans text-text_grey text-base md:text-[18px] leading-relaxed tracking-body">

    <header id="nav-placeholder" class="min-h-[60px] xl:min-h-0"></header>

    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-16">
        <section>
            <div class="heading mb-8">
                <h1 class="font-montserrat font-bold text-3xl md:text-4xl text-navyblue text-center uppercase">Consulting Services</h1>
            </div>

            <div class="cards grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="card bg-white rounded-2xl shadow-lg border-4 border-camp_blue overflow-hidden">
                    <div class="card-title bg-camp_blue p-4">
                        <h2 class="text-white font-montserrat font-bold text-xl md:text-2xl text-center uppercase">Fundraising</h2>
                    </div>
                    <div class="card-content p-6">
                        <ul class="list-disc list-inside space-y-2 text-darkblue">
                            <li>Fundraising Strategy Development</li>
                            <li>Campaign Planning and Execution</li>
                            <li>Training for Campaign Workers</li>
                            <li>Database Optimization</li>
                            <li>Prospect Research</li>
                            <li>Event Planning and Management</li>
                        </ul>
                    </div>
                    <div class="image w-full h-64 overflow-hidden">
                        <img src="../media/photos/dinner.JPG" alt="fundraising dinner" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="../js/includes.js"></script>
    <script src="../js/navigation.js"></script>
</body>
</html>
