<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Alex Klausing | Professional Portfolio</title>
    <meta name="description" content="Contact Alex Klausing for nonprofit management, program specialization, and leadership opportunities.">
    <meta name="author" content="Alex Klausing">
    <link href="../dist/output.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/08b6d39fd7.js" crossorigin="anonymous"></script>
</head>
<body class="flex flex-col min-h-screen font-sans text-text_grey text-base md:text-[18px] leading-relaxed tracking-body">

    <header id="nav-placeholder" class="min-h-[60px] xl:min-h-0"></header>

    <main class="contact-container flex justify-center items-center flex-grow w-full m-0 bg-cover bg-center bg-no-repeat py-16 md:py-24" style="background-image: url('../../media/photos/alexrowing1.jpg');">
        <div class="contact-box bg-sky_white/95 backdrop-blur-sm rounded-lg shadow-xl border-4 border-darkblue p-6 sm:p-8 md:p-10 w-full max-w-md sm:max-w-lg mx-4 flex flex-col justify-center items-center">
            <div id="name" class="mb-6">
                <p class="font-montserrat font-bold text-3xl sm:text-4xl text-darkblue text-center">Alex Klausing</p>
            </div>
            <div class="contact-box-sub flex flex-col items-center justify-center space-y-3 w-full">
                <div class="contact-item flex items-center text-base sm:text-lg">
                    <i class="fas fa-phone fa-fw w-5 text-center text-coral mr-2"></i>
 
                    <a class="phone text-darkblue hover:text-coral transition-colors duration-200 no-underline" href="tel:+15029302694">502-930-2694</a>
                </div>
                <div class="contact-item flex items-center text-base sm:text-lg">
                    <i class="fas fa-envelope fa-fw w-5 text-center text-coral mr-2"></i>
                    <a class="text-darkblue hover:text-coral transition-colors duration-200 no-underline break-all" href="mailto:alex.klausing@icloud.com">alex.klausing@icloud.com</a>
                </div>
                <div class="contact-item flex items-center text-base sm:text-lg">
                    <i class="fab fa-linkedin fa-fw w-5 text-center text-coral mr-2 text-xl"></i> 
                    <a class="linkedin-link flex items-center text-darkblue hover:text-coral transition-colors duration-200 no-underline" href="https://www.linkedin.com/in/alexklausing/">
                        <span>/alexklausing</span>
                    </a>
                </div>
                <div class="contact-item flex items-center text-base sm:text-lg mt-1"> 
                    <i class="fas fa-map-marker-alt fa-fw w-5 text-center text-coral mr-2"></i>
                    <address class="text-darkblue not-italic">Lakeland, Florida USA</address>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="../js/includes.js"></script>
    <script src="../js/navigation.js"></script>

</body>
</html>
